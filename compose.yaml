name: lifeline

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 to create .env}
      POSTGRES_DB: lifeline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeline -d lifeline"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  api:
    build: ./services/api
    env_file: .env
    environment:
      LIFELINE_DATABASE_URL: postgresql+psycopg://lifeline:${POSTGRES_PASSWORD}@db:5432/lifeline
      LIFELINE_TEST_DATABASE_URL: postgresql+psycopg://lifeline:${POSTGRES_PASSWORD}@db:5432/lifeline_test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 768m

  web:
    build:
      context: ./apps/web
      args:
        API_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m

volumes:
  pgdata:
