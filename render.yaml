# Render Blueprint for the hosted Lifeline sandbox demo (synthetic data only).
# Render docs: https://render.com/docs/blueprint-spec
#
# - lifeline-db: free PostgreSQL. Free databases EXPIRE 30 days after creation
#   (14-day grace to upgrade, then deleted) and have no backups.
# - lifeline-api: the FastAPI image from services/api (free web service; sleeps
#   after 15 minutes without traffic, about one minute to wake).
# The Next.js frontend is deployed separately on Vercel and proxies /api/* here.
#
# Secrets are generated by Render (generateValue) and never stored in Git.

databases:
  - name: lifeline-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: lifeline
    user: lifeline
    ipAllowList: [] # private network only: no connections from the internet

services:
  - type: web
    name: lifeline-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: ./services/api
    dockerfilePath: ./services/api/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: LIFELINE_DATABASE_URL
        fromDatabase:
          name: lifeline-db
          property: connectionString # internal URL; normalised to postgresql+psycopg:// by the app
      - key: LIFELINE_ENV
        value: hosted_demo # public sandbox demo: secure cookies + strong demo password required
      - key: LIFELINE_SANDBOX_EVENT_SECRET
        generateValue: true
      - key: LIFELINE_DEMO_PASSWORD
        generateValue: true # read it in the Render dashboard (Environment); share only with your team
      - key: LIFELINE_DEMO_CONTROLS_ENABLED
        value: "true"
      - key: LIFELINE_COOKIE_SECURE
        value: "true"
      - key: LIFELINE_AI_MODE
        sync: false # owner-managed: unset or "demo" = offline demo assistant; "live" after adding the key and model below
      - key: LIFELINE_ANTHROPIC_API_KEY
        sync: false # secret, owner sets it in the dashboard (never in Git)
      - key: LIFELINE_ANTHROPIC_MODEL
        sync: false # e.g. claude-opus-5-5
      - key: LIFELINE_AI_PROVIDER
        sync: false # "anthropic" (default) or "gemini" (Google Gemini API, free tier available)
      - key: LIFELINE_GEMINI_API_KEY
        sync: false # secret, owner sets it in the dashboard (Google AI Studio key; never in Git)
      - key: LIFELINE_GEMINI_MODEL
        sync: false # a current Gemini "Flash" model name from Google AI Studio
      - key: LIFELINE_EMAIL_PROVIDER
        sync: false # "smtp" for Gmail (teamlifeline01@gmail.com); unset/off = no emails (the app says so)
      - key: LIFELINE_EMAIL_FROM
        sync: false # teamlifeline01@gmail.com
      - key: LIFELINE_SMTP_USERNAME
        sync: false # teamlifeline01@gmail.com
      - key: LIFELINE_SMTP_PASSWORD
        sync: false # secret: a Gmail app password, set only in the dashboard (never in Git)
      - key: LIFELINE_BREVO_API_KEY
        sync: false # secret: Brevo API key; use with LIFELINE_EMAIL_PROVIDER=brevo (Render's free plan blocks SMTP)
      - key: LIFELINE_FX_PROVIDER
        value: erapi # ExchangeRate-API open access (no key, daily, covers BDT); ECB is the named fallback
      - key: LIFELINE_PUBLIC_APP_URL
        value: https://lifeline-rescue-psi.vercel.app # trusted origin for emailed links
      - key: LIFELINE_FRESH_ACCOUNT_PASSWORD
        sync: false # owner sets it (24+ characters) in the dashboard: designated clean account fresh@lifeline.example
      - key: PORT
        value: "8000"
      - key: LIFELINE_TRUSTED_PROXY_HOPS
        value: "1" # the right-most X-Forwarded-For entry is appended by Render and can't be forged
      - key: LIFELINE_PROXY_SECRET
        sync: false # optional: same value as LIFELINE_PROXY_SECRET on Vercel; lets the API see real client IPs
      - key: WEB_CONCURRENCY
        value: "1" # the free instance has 512 MB of memory
